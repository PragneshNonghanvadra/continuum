<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Continuum Capture</title>
    <style>
      body {
        background: #f3f6f4;
        color: #172622;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 280px;
      }

      main {
        display: grid;
        gap: 10px;
        padding: 16px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
      }

      p {
        font-weight: 700;
        margin: 0;
      }

      ul {
        color: #52615d;
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Continuum</h1>
      <p id="status">Checking local app...</p>
      <ul id="details"></ul>
    </main>
    <script src="dist-extension/popup.js"></script>
  </body>
</html>
