[package]
name = "continuum"
version = "0.1.0"
description = "Local-first personal memory capture system"
authors = ["Continuum"]
edition = "2021"

[lib]
name = "continuum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
